- ckpt_base_path=/path/to/sandwich_residuals/checkpoints/mediummaze_dynamics_shift
- model_name=mediummaze_dynamics_shift
- eval_data_path=/path/to/sandwich_residuals/data/point_maze_medium
- n_evals=50
- seed=1001
- +wandb_logging=false
- ++planner.adapt.mode=layer
- ++planner.adapt.continual=false
- ++planner.adapt.lr=0.0005
- ++planner.adapt.encoder_lr=1e-05
- ++planner.adapt.steps=1
- ++planner.adapt.optimizer=adam
- ++planner.adapt.finetune_every=1
- ++planner.adapt.replay_buffer=recent5
- ++planner.adapt.finetune_encoder=true
- ++planner.adapt.last_layer_only=true
- ++planner.adapt.predictor_block=last
- ++planner.adapt.encoder_last_layer_only=true
- ++planner.adapt.loss_weighting=feature
- ++env_kwargs_override.damping_scale=50
