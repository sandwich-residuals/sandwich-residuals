ckpt_base_path: /path/to/sandwich_residuals/checkpoints/pushobj_shape_shift
model_name: pushobj_shape_shift
model_epoch: latest
seed: 1003
n_evals: 50
goal_source: segments
eval_data_path: /path/to/sandwich_residuals/data/pushobj_eval/val_+/plan_targets.pkl
ood_corruption: null
ood_level: null
env_kwargs_override: null
goal_H: 25
n_plot_samples: 10
decode_for_viz: false
num_start_frames: 1
debug_dset_init: false
objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: staged
planner:
  _target_: planning.adajepa_mpc.AdaJEPAMPCPlanner
  max_iter: 20
  n_taken_actions: 5
  adapt:
    mode: layer
    continual: false
    lr: 0.0005
    step_norm: null
    linear_lr: null
    mlp_lr: null
    steps: 1
    optimizer: adam
    finetune_every: 1
    replay_buffer: recent5
    finetune_encoder: true
    encoder_lr: 1.0e-05
    last_layer_only: true
    predictor_block: last
    encoder_last_layer_only: true
    streams:
    - action
    visual: none
    output: none
    output_proprio: mlp
    agent_hidden: 0
    visual_hidden: 64
    output_hidden: 64
    init_scale: 0.0
    rms_cap: null
    gate_candidates: null
    gate_passes: 1
    loss_weighting: feature
  reuse_actions: true
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 25
    topk: 30
    num_samples: 200
    var_scale: 1
    opt_steps: 10
    eval_every: -1
  name: adajepa_plan_cem_pushobj
wandb_logging: false
