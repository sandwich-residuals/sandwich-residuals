ckpt_base_path: /path/to/sandwich_residuals/checkpoints/diversemaze_layout_shift
model_name: diversemaze_layout_shift
model_epoch: latest
seed: 1001
n_evals: 50
goal_source: maze_dist
eval_data_path: /path/to/sandwich_residuals/data/diverse_maze
min_block_radius: 3
max_block_radius: 5
goal_H: 25
n_plot_samples: 10
decode_for_viz: false
num_start_frames: 1
debug_dset_init: false
objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: all
planner:
  _target_: planning.adajepa_mpc.AdaJEPAMPCPlanner
  max_iter: 20
  n_taken_actions: 5
  adapt:
    lr: 0.0
    steps: 0
    optimizer: adam
    finetune_every: 1
    replay_buffer: false
    finetune_encoder: false
    encoder_lr: 0.0
    last_layer_only: true
    encoder_last_layer_only: true
    mode: layer
    continual: false
    predictor_block: last
    loss_weighting: feature
  reuse_actions: true
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 25
    topk: 30
    num_samples: 200
    var_scale: 1
    opt_steps: 10
    eval_every: -1
  name: adajepa_plan_cem_diversemaze
wandb_logging: false
