- ckpt_base_path=/path/to/sandwich_residuals/checkpoints/diversemaze_layout_shift
- model_name=diversemaze_layout_shift
- eval_data_path=/path/to/sandwich_residuals/data/diverse_maze
- n_evals=50
- seed=1003
- +wandb_logging=false
- ++planner.adapt.mode=layer
- ++planner.adapt.continual=false
- ++planner.adapt.lr=0.0
- ++planner.adapt.encoder_lr=0.0
- ++planner.adapt.steps=0
- ++planner.adapt.optimizer=adam
- ++planner.adapt.finetune_every=1
- ++planner.adapt.replay_buffer=false
- ++planner.adapt.finetune_encoder=false
- ++planner.adapt.last_layer_only=true
- ++planner.adapt.predictor_block=last
- ++planner.adapt.encoder_last_layer_only=true
- ++planner.adapt.loss_weighting=feature
- ++min_block_radius=3
- ++max_block_radius=5
